name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Japanese-only build
        run: |
          # 1. 日本語ページを英語ページとしてコピー（上書き）
          find pages -name "*.jp.mdx" | while read file; do
            newfile="${file%.jp.mdx}.mdx"
            cp "$file" "$newfile"
          done

          # 2. 日本語メタファイルを英語メタファイルとしてコピー
          find pages -name "_meta.jp.json" | while read file; do
            newfile="${file%.jp.json}.json"
            cp "$file" "$newfile"
          done

          # 3. 日本語以外の全ての言語ファイルを削除（*.jp.mdx と _meta.jp.json は除外）
          find pages -type f \( \
            -name "*.ar.mdx" -o -name "*.ca.mdx" -o -name "*.de.mdx" -o \
            -name "*.en.mdx" -o -name "*.es.mdx" -o -name "*.fi.mdx" -o \
            -name "*.fr.mdx" -o -name "*.it.mdx" -o \
            -name "*.kr.mdx" -o -name "*.pt.mdx" -o -name "*.ru.mdx" -o \
            -name "*.tr.mdx" -o -name "*.zh.mdx" -o \
            -name "_meta.ar.json" -o -name "_meta.ca.json" -o -name "_meta.de.json" -o \
            -name "_meta.en.json" -o -name "_meta.es.json" -o -name "_meta.fi.json" -o \
            -name "_meta.fr.json" -o -name "_meta.it.json" -o \
            -name "_meta.kr.json" -o -name "_meta.pt.json" -o -name "_meta.ru.json" -o \
            -name "_meta.tr.json" -o -name "_meta.zh.json" \
          \) -delete

          # 4. ar-pages ディレクトリも削除（アラビア語用の別ディレクトリ）
          rm -rf ar-pages

          # 5. middleware.js を削除（静的エクスポートでは不要）
          rm -f middleware.js

      - name: Generate next.config.js
        run: |
          cat > next.config.js << 'EOF'
          const withNextra = require('nextra')({
            theme: 'nextra-theme-docs',
            themeConfig: './theme.config.tsx',
            latex: true
          })

          module.exports = withNextra({
            output: 'export',
            images: {
              unoptimized: true
            },
            basePath: '/Prompt-Engineering-Guide',
            trailingSlash: true,
            webpack(config) {
              const allowedSvgRegex = /components\/icons\/.+\.svg$/
              const fileLoaderRule = config.module.rules.find(rule =>
                rule.test?.test?.('.svg')
              )
              fileLoaderRule.exclude = allowedSvgRegex
              config.module.rules.push({
                test: allowedSvgRegex,
                use: ['@svgr/webpack']
              })
              return config
            }
          })
          EOF

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
