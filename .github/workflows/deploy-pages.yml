name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Japanese-only build
        run: |
          # 日本語ページを英語ページとしてコピー（上書き）
          find pages -name "*.jp.mdx" | while read file; do
            newfile="${file%.jp.mdx}.mdx"
            cp "$file" "$newfile"
            echo "Copied: $file -> $newfile"
          done

          # 日本語メタファイルを英語メタファイルとしてコピー
          find pages -name "_meta.jp.json" | while read file; do
            newfile="${file%.jp.json}.json"
            cp "$file" "$newfile"
            echo "Copied: $file -> $newfile"
          done

          # next.config.js から i18n 設定を削除し、静的エクスポート設定を追加
          cat > next.config.js << 'EOF'
          const withNextra = require('nextra')({
            theme: 'nextra-theme-docs',
            themeConfig: './theme.config.tsx',
            latex: true
          })

          module.exports = withNextra({
            output: 'export',
            images: {
              unoptimized: true
            },
            basePath: '/Prompt-Engineering-Guide',
            trailingSlash: true,
            webpack(config) {
              const allowedSvgRegex = /components\/icons\/.+\.svg$/
              const fileLoaderRule = config.module.rules.find(rule =>
                rule.test?.test?.('.svg')
              )
              fileLoaderRule.exclude = allowedSvgRegex
              config.module.rules.push({
                test: allowedSvgRegex,
                use: ['@svgr/webpack']
              })
              return config
            }
          })
          EOF

          # middleware.js を削除（静的エクスポートでは不要）
          rm -f middleware.js

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
